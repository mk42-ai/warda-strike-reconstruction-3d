<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <title>IMP-08 Warda Strike Reconstruction · AIREV | On Demand</title>
    <meta
      name="description"
      content="High-fidelity CesiumJS + Three.js 3D reconstruction of the IMP-08 Iran→Dubai Shahed-136 loitering-munition strike on Warda Apartments: LIVE key-free ESRI World Imagery + World Terrain, cinematic post-processing (HDR/bloom/SSAO/ACES), full launch→impact trajectory, 8 camera modes, VIIRS-driven thermal/IR overwatch and an endurance-derived geofence. AIREV | OnDemand Sentinel Overwatch."
    />
    <!-- LIVE, key-free imagery/terrain providers used by the scene (no Cesium ion) -->
    <link rel="preconnect" href="https://services.arcgisonline.com" crossorigin />
    <link rel="preconnect" href="https://elevation3d.arcgis.com" crossorigin />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/brand/ondemand-icon.svg" />
    <script>
      // Resolve boot-screen logo against Vite BASE_URL so a copied Vercel /
      // sandbox host (or a non-root base) still serves /brand/*.png as PNG,
      // not the SPA HTML fallback.
      (function () {
        var base = '/';
        try {
          var s = document.currentScript || document.querySelector('script[src*="main"]');
          if (s && s.src) {
            var u = new URL(s.src, location.href);
            base = u.pathname.replace(/src\/main\.jsx.*$/, '').replace(/assets\/.*$/, '');
          }
        } catch (_) {}
        window.__ASSET_BASE__ = base.endsWith('/') ? base : base + '/';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-screen">
      <div class="boot-inner">
        <img class="boot-logo" src="/brand/od-logo-black.png" alt="On Demand" height="28" onerror="this.onerror=null;this.src=(window.__ASSET_BASE__||'/')+'brand/ondemand-icon.svg';" />
        <div class="boot-ring"></div>
        <div class="boot-title">On Demand · Sentinel</div>
        <div class="boot-sub">IMP-08 — initializing theatre…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
